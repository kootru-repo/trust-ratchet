name: Publish to npm
# Runs when a GitHub release is published. Needs the repository secret NPM_TOKEN (an npm automation token).
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm ci
      - run: npm run check-types
      - run: npm test
      - name: Publish (skipped while no NPM_TOKEN secret is set)
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
