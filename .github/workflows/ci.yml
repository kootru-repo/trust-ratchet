name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Linux is not supported yet: its job runs to show progress and does not fail the build.
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    env:
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
      TMPDIR: ${{ runner.temp }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm ci
      - run: npm run check-types
      - run: npm test
